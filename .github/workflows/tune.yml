name: Measure concurrency and replay
run-name: Measure DeepSeek concurrency before Thursday-Friday replay
on:
  workflow_dispatch:
    inputs:
      timeout_seconds:
        description: Per-request measurement deadline; larger values distinguish slow service from short-deadline failures
        type: choice
        options: ['180', '600', '900']
        default: '180'
permissions:
  contents: read
  actions: write
concurrency:
  group: stock-account
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PAPER_TRADER_API_KEY: ${{ secrets.PAPER_TRADER_API_KEY }}
      PAPER_TRADER_API_URL: ${{ vars.PAPER_TRADER_API_URL }}
      PAPER_TRADER_API_MODEL: ${{ vars.PAPER_TRADER_API_MODEL }}
      PAPER_TRADER_API_RPM: ${{ vars.PAPER_TRADER_API_RPM }}
      PAPER_TRADER_API_TPM: ${{ vars.PAPER_TRADER_API_TPM }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Snapshot the public model queue
        continue-on-error: true
        run: |
          curl -fsS --max-time 15 'https://buildapi.ngc.nvidia.com/v2/predict/queues/models/qc69jvmznzxy/deepseek-v4.1-flash' > provider-queue.json
          date -u +%FT%TZ > provider-queue-at.txt
      - name: Compare one, two and four workers and repeat the serial baseline
        id: benchmark
        env:
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds || '180' }}
        run: |
          ./target/release/paper-trader tune --levels 1,2,4,1 --samples 4 --timeout "$TIMEOUT_SECONDS" --output concurrency.json
      - name: Preserve benchmark evidence, including failed rounds
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: concurrency-measurements
          path: |
            concurrency.json
            provider-queue.json
            provider-queue-at.txt
          if-no-files-found: warn
      - name: Choose the next action directly from the completed report
        if: always() && !cancelled()
        id: next
        run: python3 scripts/tuning_next.py concurrency.json >> "$GITHUB_OUTPUT"
      - name: Start the sequential replay with the measured worker count
        if: "!cancelled() && steps.next.outcome == 'success' && steps.next.outputs.workers != ''"
        env:
          GH_TOKEN: ${{ github.token }}
          WORKERS: ${{ steps.next.outputs.workers }}
        run: gh workflow run replay.yml --repo "$GITHUB_REPOSITORY" --ref main -f workers="$WORKERS"
      - name: Repeat measurements with a longer deadline
        if: "!cancelled() && steps.next.outcome == 'success' && steps.next.outputs.deadline != ''"
        env:
          GH_TOKEN: ${{ github.token }}
          DEADLINE: ${{ steps.next.outputs.deadline }}
        run: gh workflow run tune.yml --repo "$GITHUB_REPOSITORY" --ref main -f timeout_seconds="$DEADLINE"
