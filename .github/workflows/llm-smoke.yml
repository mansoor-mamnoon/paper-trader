name: Model smoke test
# Runs the open-weights analyst on a throwaway account so the live ledger is untouched.
on:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - uses: actions/cache@v4
        with:
          path: ~/.cache/paper-trader-llm
          key: llm-qwen3-4b-instruct-2507-q4km-b12211
      - run: scripts/llm.sh
      - name: Trade a scratch account with the model
        env:
          PAPER_TRADER_LLM_URL: http://127.0.0.1:8080
          PAPER_TRADER_LLM_MODEL: qwen3-4b-instruct-2507
        run: |
          start=$(date +%s)
          ./target/release/paper-trader stocks --db "$RUNNER_TEMP/scratch/account.sqlite" --output "$RUNNER_TEMP/scratch/site" --batch-size 200
          echo "seconds: $(( $(date +%s) - start ))"
          sqlite3 "$RUNNER_TEMP/scratch/account.sqlite" "select action, symbol, substr(reason,1,140) from decisions where action in ('BUY_SIGNAL','AVOID')"
          jq -c '.strategy.analyst' "$RUNNER_TEMP/scratch/site/api/state"
          jq -e '.strategy.analyst.source == "llm"' "$RUNNER_TEMP/scratch/site/api/state" > /dev/null
