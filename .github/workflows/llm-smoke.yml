name: Model smoke test
# Runs the full desk, with all nine models, on a throwaway account so the live ledger is
# untouched. Use it to check timing, disk, determinism and SEC reachability on a real runner.
on:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Install llama.cpp
        run: echo "PAPER_TRADER_LLAMA_SERVER=$(scripts/llm.sh install)" >> "$GITHUB_ENV"
      - name: Check that SEC EDGAR is reachable from the runner
        continue-on-error: true
        run: cargo run --release --example edgar_live
      - name: Trade a scratch account with the whole desk
        env:
          PAPER_TRADER_MODELS_DIR: ${{ runner.temp }}/models
          PAPER_TRADER_PRUNE_MODELS: "1"
          PAPER_TRADER_DESK_MINUTES: "300"
        run: |
          df -h / /mnt | tail -2
          start=$(date +%s)
          ./target/release/paper-trader stocks --db "$RUNNER_TEMP/scratch/account.sqlite" --output "$RUNNER_TEMP/scratch/site" --batch-size 200
          echo "seconds: $(( $(date +%s) - start ))"
          df -h / /mnt | tail -2
          state="$RUNNER_TEMP/scratch/site/api/state"
          jq -c '.strategy.analyst' "$state"
          jq -c '.strategy.desk | {depth, minutes_left, degraded, finalists: [.finalists[].symbol], judge_regime: .judge.regime}' "$state"
          jq -c '.strategy.telemetry.stages' "$state"
          jq -c '.strategy.telemetry.determinism' "$state"
          jq -e '.strategy.analyst.source == "llm"' "$state" > /dev/null
