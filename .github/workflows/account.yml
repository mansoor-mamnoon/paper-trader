name: Stock paper account
on:
  workflow_dispatch:
    inputs:
      force:
        description: Run even if the desk already processed the latest session
        type: boolean
        default: false
  repository_dispatch:
    types: [run-account]
  schedule:
    # GitHub can delay or drop a scheduled run, so the job is scheduled three times after
    # the US session (22:37 UTC is 17:37 New York in winter). A run skips itself when the
    # desk already processed the latest session, so extra triggers cost nothing.
    - cron: '37 22 * * 1-5'
    - cron: '47 0 * * 2-6'
    - cron: '23 3 * * 2-6'
permissions:
  contents: write
  pages: write
  id-token: write
  actions: write
concurrency:
  group: stock-account
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Cache the model file
        # The desk downloads llama.cpp and the pinned model itself; the cache only saves time.
        uses: actions/cache@v4
        with:
          path: ~/.cache/paper-trader-llm
          key: llm-${{ hashFiles('src/models.rs', 'src/llm.rs') }}
      - name: Restore durable account (absence is an error, never a reset)
        uses: actions/checkout@v7
        with:
          ref: account
          path: account
      - name: Validate account
        run: |
          test -s account/account.sqlite
          test -f account/INITIALIZED
          test "$(sqlite3 account/account.sqlite 'PRAGMA integrity_check')" = ok
          df -h / | tail -1
          free -g | head -2
      - name: Run the desk and export the dashboard
        id: desk
        continue-on-error: true
        run: ./target/release/paper-trader run --db account/account.sqlite --output account/site --minutes 250 ${{ inputs.force && '--force' || '' }}
      - name: Apply static dashboard
        run: cp -r web/* account/site/
      - name: Configure visitor analytics
        env:
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
          GA4_ID: ${{ vars.GA4_ID }}
        run: |
          gc=$(printf '%s' "$GOATCOUNTER_CODE" | tr -cd 'A-Za-z0-9-')
          ga=$(printf '%s' "$GA4_ID" | tr -cd 'A-Za-z0-9-')
          printf 'window.PT_ANALYTICS = { goatcounter: "%s", ga4: "%s" };\n' "$gc" "$ga" > account/site/analytics-config.js
      - name: Save account before deployment
        working-directory: account
        run: |
          git config user.name 'paper-trader[bot]'
          git config user.email 'paper-trader@users.noreply.github.com'
          git add -A account.sqlite site INITIALIZED
          git diff --cached --quiet || git commit -m 'Record the desk day'
          git push origin HEAD:account
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: account/site
      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Keep the schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable account.yml --repo "$GITHUB_REPOSITORY" || true
      - name: Report a desk failure after preserving its evidence
        if: steps.desk.outcome == 'failure'
        run: exit 1
