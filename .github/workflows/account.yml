name: Stock paper account
on:
  workflow_dispatch:
  # An external webhook can also start a run:
  #   curl -X POST -H "Authorization: Bearer $TOKEN" \
  #     https://api.github.com/repos/mansoor-mamnoon/paper-trader/dispatches -d '{"event_type":"run-account"}'
  repository_dispatch:
    types: [run-account]
  schedule:
    # 17:37 New York in winter, 18:37 in summer; after the US session.
    - cron: '37 22 * * 1-5'
permissions:
  contents: write
  pages: write
  id-token: write
  actions: write
concurrency:
  group: stock-account
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Cache the open-weights model
        uses: actions/cache@v4
        with:
          path: ~/.cache/paper-trader-llm
          key: llm-qwen3-4b-instruct-2507-q4km-b12211
      - name: Start the open-weights model
        # If this fails the account still trades, ranked by momentum, and says so.
        continue-on-error: true
        run: scripts/llm.sh
      - name: Restore durable account (absence is an error, never a reset)
        uses: actions/checkout@v7
        with:
          ref: account
          path: account
      - name: Validate account
        run: |
          test -s account/account.sqlite
          test -f account/INITIALIZED
          test "$(sqlite3 account/account.sqlite 'PRAGMA integrity_check')" = ok
      - name: Evaluate latest completed stock session and export dashboard
        id: scan
        continue-on-error: true
        env:
          PAPER_TRADER_LLM_URL: http://127.0.0.1:8080
          PAPER_TRADER_LLM_MODEL: qwen3-4b-instruct-2507
        run: ./target/release/paper-trader stocks --db account/account.sqlite --output account/site
      - name: Apply static dashboard
        run: cp web/* account/site/
      - name: Save account before deployment
        working-directory: account
        run: |
          git config user.name 'paper-trader[bot]'
          git config user.email 'paper-trader@users.noreply.github.com'
          git add account.sqlite site INITIALIZED strategies
          git diff --cached --quiet || git commit -m 'Record stock paper account observation'
          git push origin HEAD:account
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: account/site
      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Keep the schedule alive
        # GitHub pauses scheduled workflows in repositories with no recent activity.
        # Re-enabling this one on every run keeps the account running unattended.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable account.yml --repo "$GITHUB_REPOSITORY" || true
      - name: Report scan failure after preserving its evidence
        if: steps.scan.outcome == 'failure'
        run: exit 1
