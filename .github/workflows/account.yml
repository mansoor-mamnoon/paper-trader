name: Stock paper account
on:
  workflow_dispatch:
    inputs:
      force:
        description: Run even if the desk already processed the latest session
        type: boolean
        default: false
      as_of:
        description: Optional RFC3339 cutoff for a historical session
        type: string
        default: ''
  repository_dispatch:
    types: [run-account]
  schedule:
    # GitHub can delay or drop a scheduled run, so the job is scheduled three times after
    # the US session (22:37 UTC is 17:37 New York in winter). A run skips itself when the
    # desk already processed the latest session, so extra triggers cost nothing.
    - cron: '37 22 * * 1-5'
    - cron: '47 0 * * 2-6'
    - cron: '23 3 * * 2-6'
permissions:
  contents: write
  pages: write
  id-token: write
  actions: write
concurrency:
  group: stock-account
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Cache the model file
        # The desk downloads llama.cpp and the pinned model itself; the cache only saves time.
        uses: actions/cache@v4
        with:
          path: ~/.cache/paper-trader-llm
          key: llm-${{ hashFiles('src/models.rs', 'src/sentiment.rs') }}
      - name: Restore durable account (absence is an error, never a reset)
        uses: actions/checkout@v7
        with:
          ref: account
          fetch-depth: 0
          path: account
      - name: Validate account
        run: |
          test -s account/account.sqlite
          test -f account/INITIALIZED
          test "$(sqlite3 account/account.sqlite 'PRAGMA integrity_check')" = ok
          df -h / | tail -1
          free -g | head -2
      - name: Stage Friday closing account and preserve original Monday ledger
        run: |
          test "$(git -C account rev-parse HEAD:account.sqlite)" = "$(git -C account rev-parse 01911f9:account.sqlite)"
          test "$(jq -r .latest.day account/site/api/state.json)" = 2026-11-23
          mkdir -p "account/archive/rerun-${GITHUB_RUN_ID}"
          cp account/account.sqlite "account/archive/rerun-${GITHUB_RUN_ID}/account.sqlite"
          git -C account show b6fc6e0669b59b6968c7db570e42ae7faadab729:account.sqlite > "$RUNNER_TEMP/replay.sqlite"
      - name: Run the desk and export the dashboard
        timeout-minutes: 345
        id: desk
        env:
          # Nemotron 3 Ultra 550B via NVIDIA; the key stays in Actions secrets.
          # The local model remains available if the free endpoint is unavailable.
          PAPER_TRADER_API_KEY: ${{ secrets.PAPER_TRADER_API_KEY }}
          PAPER_TRADER_API_URL: ${{ vars.PAPER_TRADER_API_URL }}
          PAPER_TRADER_API_MODEL: ${{ vars.PAPER_TRADER_API_MODEL }}
          PAPER_TRADER_API_RPM: ${{ vars.PAPER_TRADER_API_RPM }}
          PAPER_TRADER_API_TPM: ${{ vars.PAPER_TRADER_API_TPM }}
          PAPER_TRADER_WORKERS: ${{ vars.PAPER_TRADER_WORKERS }}
          PAPER_TRADER_API_TIMEOUT_SECONDS: ${{ vars.PAPER_TRADER_API_TIMEOUT_SECONDS }}
          FORCE_RERUN: ${{ inputs.force }}
          AS_OF: ${{ inputs.as_of }}
        run: |
          args=(run --db "$RUNNER_TEMP/replay.sqlite" --output "$RUNNER_TEMP/replay-site" --minutes 0)
          if [ "$FORCE_RERUN" = true ]; then args+=(--force); fi
          if [ -n "$AS_OF" ]; then args+=(--as-of "$AS_OF"); fi
          ./target/release/paper-trader "${args[@]}"
      - name: Verify completed replay and promote its account
        run: |
          state="$RUNNER_TEMP/replay-site/api/state.json"
          jq -e '.latest.day == "2026-11-23" and (.latest.at == 1795469912.5308976) and (.latest.funnel.candidates > 0) and (.latest.decisions | length >= 4) and (.latest.note | length > 0) and ([.latest.cards[] | select(.holding != null)] | length == 4) and (.latest.problems | length == 0)' "$state"
          test "$(sqlite3 "$RUNNER_TEMP/replay.sqlite" 'PRAGMA integrity_check')" = ok
          cp "$RUNNER_TEMP/replay.sqlite" account/account.sqlite
          cp -R "$RUNNER_TEMP/replay-site/." account/site/
      - name: Apply static dashboard
        run: cp -r web/* account/site/
      - name: Configure visitor analytics
        env:
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
          GA4_ID: ${{ vars.GA4_ID }}
        run: |
          gc=$(printf '%s' "$GOATCOUNTER_CODE" | tr -cd 'A-Za-z0-9-')
          ga=$(printf '%s' "$GA4_ID" | tr -cd 'A-Za-z0-9-')
          printf 'window.PT_ANALYTICS = { goatcounter: "%s", ga4: "%s" };\n' "$gc" "$ga" > account/site/analytics-config.js
      - name: Save account before deployment
        working-directory: account
        run: |
          git config user.name 'paper-trader[bot]'
          git config user.email 'paper-trader@users.noreply.github.com'
          git add -A account.sqlite site INITIALIZED archive
          git diff --cached --quiet || git commit -m 'Record the desk day'
          git push origin HEAD:account
