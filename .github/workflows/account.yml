name: Stock paper account
on:
  workflow_dispatch:
    inputs:
      force:
        description: Run even if the account already processed the latest session
        type: boolean
        default: false
  # An external webhook can also start a run:
  #   curl -X POST -H "Authorization: Bearer $TOKEN" \
  #     https://api.github.com/repos/mansoor-mamnoon/paper-trader/dispatches -d '{"event_type":"run-account"}'
  repository_dispatch:
    types: [run-account]
  schedule:
    # GitHub can delay or silently drop a scheduled run when it is busy, so the same job is
    # scheduled three times a day, and scripts/trigger.sh (launchd) or trigger/worker.js
    # (Cloudflare cron) can start it from outside. The run skips itself when the account
    # already processed the latest session (16:30 ET), so extra triggers cost nothing.
    # 22:37 UTC is 17:37 New York in winter and 18:37 in summer, after the US session.
    - cron: '37 22 * * 1-5'
    - cron: '47 0 * * 2-6'
    - cron: '23 3 * * 2-6'
permissions:
  contents: write
  pages: write
  id-token: write
  actions: write
concurrency:
  group: stock-account
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Install llama.cpp
        # The Rust binary downloads, verifies and swaps the pinned models itself.
        run: echo "PAPER_TRADER_LLAMA_SERVER=$(scripts/llm.sh install)" >> "$GITHUB_ENV"
      - name: Restore durable account (absence is an error, never a reset)
        uses: actions/checkout@v7
        with:
          ref: account
          path: account
      - name: Validate account
        run: |
          test -s account/account.sqlite
          test -f account/INITIALIZED
          test "$(sqlite3 account/account.sqlite 'PRAGMA integrity_check')" = ok
          df -h / /mnt | tail -2
      - name: Evaluate latest completed stock session and export dashboard
        id: scan
        continue-on-error: true
        env:
          PAPER_TRADER_MODELS_DIR: ${{ runner.temp }}/models
          PAPER_TRADER_PRUNE_MODELS: "1"
          PAPER_TRADER_DESK_MINUTES: "240"
          # SEC EDGAR requires a real contact in the user agent. Set a repository variable
          # named SEC_CONTACT to an email address to turn SEC filings on.
          PAPER_TRADER_SEC_CONTACT: ${{ vars.SEC_CONTACT }}
          PAPER_TRADER_SKIP_IF_CURRENT: ${{ inputs.force && '0' || '1' }}
        run: ./target/release/paper-trader stocks --db account/account.sqlite --output account/site
      - name: Apply static dashboard
        run: cp web/* account/site/
      - name: Configure visitor analytics
        # Off unless the repository variables GOATCOUNTER_CODE and/or GA4_ID are set.
        env:
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
          GA4_ID: ${{ vars.GA4_ID }}
        run: |
          gc=$(printf '%s' "$GOATCOUNTER_CODE" | tr -cd 'A-Za-z0-9-')
          ga=$(printf '%s' "$GA4_ID" | tr -cd 'A-Za-z0-9-')
          printf 'window.PT_ANALYTICS = { goatcounter: "%s", ga4: "%s" };\n' "$gc" "$ga" > account/site/analytics-config.js
      - name: Save account before deployment
        working-directory: account
        run: |
          git config user.name 'paper-trader[bot]'
          git config user.email 'paper-trader@users.noreply.github.com'
          git add account.sqlite site INITIALIZED strategies
          git diff --cached --quiet || git commit -m 'Record stock paper account observation'
          git push origin HEAD:account
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: account/site
      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Keep the schedule alive
        # GitHub pauses scheduled workflows in repositories with no recent activity.
        # Re-enabling this one on every run keeps the account running unattended.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable account.yml --repo "$GITHUB_REPOSITORY" || true
      - name: Report scan failure after preserving its evidence
        if: steps.scan.outcome == 'failure'
        run: exit 1
