<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="The investment desk: screen, triage, research agents with tools, bull and bear debate, judge, then the position doctor, memory, scorecard and the depth ladder feed back in">
<defs><pattern id="g" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#dde5f4" stroke-width="1.4"/></pattern></defs>
<style>
text{font-family:'Helvetica Neue',Arial,sans-serif;fill:#0f1115}
.h{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;font-weight:700;letter-spacing:2px}
.t{font-size:18px;font-weight:900;letter-spacing:-.4px}
.s{font-size:12.5px;fill:#44505f;font-family:ui-monospace,Menlo,Consolas,monospace}
.n{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;font-weight:700}
.b{fill:#fff;stroke:#0f1115;stroke-width:2.5}
.y{fill:#ffe14d;stroke:#0f1115;stroke-width:2.5}
.d{fill:#fbfbf8;stroke:#0f1115;stroke-width:2.5;stroke-dasharray:7 5}
.sh{fill:#0f1115}
.a{fill:none;stroke:#0f1115;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
</style>
<rect width="1200" height="620" fill="#fbfbf8"/><rect width="1200" height="620" fill="url(#g)"/><rect x="1.5" y="1.5" width="1197" height="617" fill="none" stroke="#0f1115" stroke-width="3"/>
<text class="h" x="36" y="40">THE DESK, EVERY WEEKDAY AFTER THE CLOSE</text>

<!-- row 1 -->
<rect class="sh" x="42" y="76" width="168" height="172" rx="10"/><rect class="b" x="36" y="70" width="168" height="172" rx="10"/>
<text class="n" x="48" y="92">01</text><text class="t" x="48" y="116">Screen</text>
<text class="s" x="48" y="140">13k tickers in,</text><text class="s" x="48" y="158">trend, momentum,</text><text class="s" x="48" y="176">liquidity out</text><text class="s" x="48" y="204">219 → 23</text>

<rect class="sh" x="242" y="76" width="168" height="172" rx="10"/><rect class="b" x="236" y="70" width="168" height="172" rx="10"/>
<text class="n" x="248" y="92">02</text><text class="t" x="248" y="116">Triage</text>
<text class="s" x="248" y="140">scores 0 to 10,</text><text class="s" x="248" y="158">8 stocks a call,</text><text class="s" x="248" y="176">verified evidence</text><text class="s" x="248" y="204">bounded finalist set</text>

<rect class="sh" x="442" y="76" width="236" height="172" rx="10"/><rect class="y" x="436" y="70" width="236" height="172" rx="10"/>
<text class="n" x="448" y="92">03</text><text class="t" x="448" y="116">Research agents</text>
<text class="s" x="448" y="140">choose their own tools:</text><text class="s" x="448" y="158">read_filing (SEC EDGAR)</text><text class="s" x="448" y="176">more_news · price_action</text><text class="s" x="448" y="204">up to 4 steps each</text>

<rect class="sh" x="710" y="76" width="168" height="172" rx="10"/><rect class="b" x="704" y="70" width="168" height="172" rx="10"/>
<text class="n" x="716" y="92">04</text><text class="t" x="716" y="116">Bull vs bear</text>
<text class="s" x="716" y="140">two arguments per</text><text class="s" x="716" y="158">finalist, each told</text><text class="s" x="716" y="176">to find the flaw</text><text class="s" x="716" y="204">2 calls a stock</text>

<rect class="sh" x="910" y="76" width="254" height="172" rx="10"/><rect class="y" x="904" y="70" width="254" height="172" rx="10"/>
<text class="n" x="916" y="92">05</text><text class="t" x="916" y="116">The judge</text>
<text class="s" x="916" y="140">reasons in writing first,</text><text class="s" x="916" y="158">then picks for open slots,</text><text class="s" x="916" y="176">calls the regime. risk_off</text><text class="s" x="916" y="194">allows one position.</text><text class="s" x="916" y="212">Hard limits stay in code.</text>

<g class="a"><path d="M204 145h26M404 145h26M672 145h26M872 145h26"/><path d="M222 138l8 7-8 7M422 138l8 7-8 7M690 138l8 7-8 7M890 138l8 7-8 7"/></g>

<!-- feedback -->
<text class="h" x="36" y="272">THE FEEDBACK LOOPS</text>
<rect class="sh" x="42" y="294" width="272" height="170" rx="10"/><rect class="b" x="36" y="288" width="272" height="170" rx="10"/>
<text class="t" x="52" y="318">Position doctor</text>
<text class="s" x="52" y="342">re-reads every holding daily:</text><text class="s" x="52" y="360">hold, exit if the thesis broke,</text><text class="s" x="52" y="378">or tighten the stop. It can</text><text class="s" x="52" y="396">raise a stop, never lower one.</text>

<rect class="sh" x="342" y="294" width="272" height="170" rx="10"/><rect class="b" x="336" y="288" width="272" height="170" rx="10"/>
<text class="t" x="352" y="318">Memory</text>
<text class="s" x="352" y="342">each closed trade gets a</text><text class="s" x="352" y="360">post-mortem. One-line lessons</text><text class="s" x="352" y="378">go back into the judge's</text><text class="s" x="352" y="396">prompt next time.</text>

<rect class="sh" x="642" y="294" width="272" height="170" rx="10"/><rect class="b" x="636" y="288" width="272" height="170" rx="10"/>
<text class="t" x="652" y="318">Scorecard</text>
<text class="s" x="652" y="342">every pick, veto and near-miss</text><text class="s" x="652" y="360">is scored against SPY after</text><text class="s" x="652" y="378">1, 3, 5 and 10 days. Grouped</text><text class="s" x="652" y="396">by session; scores uncalibrated.</text>

<rect class="sh" x="942" y="294" width="222" height="170" rx="10"/><rect class="y" x="936" y="288" width="222" height="170" rx="10"/>
<text class="t" x="952" y="318">Strategy lab</text>
<text class="s" x="952" y="342">proposes a bounded</text><text class="s" x="952" y="360">change each week, tests</text><text class="s" x="952" y="378">it in a shadow, adopts</text><text class="s" x="952" y="396">it only if it wins.</text><text class="s" x="952" y="420">the old strategy stays on</text>

<g class="a"><path d="M122 458V490"/><path d="M472 458V490"/><path d="M772 458V490"/></g>

<!-- ladder -->
<text class="h" x="36" y="520">THE DEPTH LADDER: EVERY LAYER OF AI HAS TO EARN ITS PLACE</text>
<rect class="sh" x="42" y="540" width="262" height="58" rx="10"/><rect class="d" x="36" y="534" width="262" height="58" rx="10"/>
<text class="t" x="50" y="558">0 · no AI</text><text class="s" x="50" y="578">momentum rank, a shadow</text>
<rect class="sh" x="334" y="540" width="262" height="58" rx="10"/><rect class="d" x="328" y="534" width="262" height="58" rx="10"/>
<text class="t" x="342" y="558">1 · single shot</text><text class="s" x="342" y="578">Liquid LFM2.5, one prompt</text>
<rect class="sh" x="626" y="540" width="262" height="58" rx="10"/><rect class="d" x="620" y="534" width="262" height="58" rx="10"/>
<text class="t" x="634" y="558">2 · committee</text><text class="s" x="634" y="578">triage, debate and judge</text>
<rect class="sh" x="918" y="540" width="246" height="58" rx="10"/><rect class="y" x="912" y="534" width="246" height="58" rx="10"/>
<text class="t" x="922" y="558">3 · full desk (live)</text><text class="s" x="922" y="578">adds research agents</text>
<g class="s" font-weight="700" style="fill:#0f1115">
<text x="248" y="232">IBM Granite</text>
<text x="448" y="232">Google Gemma 4</text>
<text x="716" y="232">Meta Llama · MS Phi</text>
<text x="916" y="232">Alibaba Qwen3 4B</text>
<text x="52" y="436">Mistral Ministral 3</text>
<text x="352" y="436">Hugging Face SmolLM3</text>
<text x="952" y="446">NVIDIA Nemotron 3</text>
</g>
</svg>
