<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 230" role="img" aria-label="Daily pipeline: scan, screen, news and earnings, model picks, queue and fill, publish">
<defs><pattern id="g" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#dde5f4" stroke-width="1.4"/></pattern></defs>
<style>
text{font-family:'Helvetica Neue',Arial,sans-serif;fill:#0f1115}
.t{font-size:18px;font-weight:900;letter-spacing:-.4px}
.s{font-size:13px;fill:#44505f;font-family:ui-monospace,Menlo,Consolas,monospace}
.n{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;font-weight:700}
.b{fill:#fff;stroke:#0f1115;stroke-width:2.5}
.sh{fill:#0f1115}
</style>
<rect width="1100" height="230" fill="#fbfbf8"/><rect width="1100" height="230" fill="url(#g)"/><rect x="1.5" y="1.5" width="1097" height="227" fill="none" stroke="#0f1115" stroke-width="3"/>
<g id="boxes">
<rect class="sh" x="30" y="63" width="152" height="112" rx="10"/><rect class="b" x="24" y="57" width="152" height="112" rx="10"/>
<rect class="sh" x="205" y="63" width="152" height="112" rx="10"/><rect class="b" x="199" y="57" width="152" height="112" rx="10"/>
<rect class="sh" x="380" y="63" width="152" height="112" rx="10"/><rect class="b" x="374" y="57" width="152" height="112" rx="10"/>
<rect class="sh" x="555" y="63" width="152" height="112" rx="10"/><rect x="549" y="57" width="152" height="112" rx="10" fill="#ffe14d" stroke="#0f1115" stroke-width="2.5"/>
<rect class="sh" x="730" y="63" width="152" height="112" rx="10"/><rect class="b" x="724" y="57" width="152" height="112" rx="10"/>
<rect class="sh" x="905" y="63" width="152" height="112" rx="10"/><rect class="b" x="899" y="57" width="152" height="112" rx="10"/>
</g>
<text class="n" x="38" y="82">01</text><text class="t" x="38" y="108">Scan</text><text class="s" x="38" y="130">13k US tickers,</text><text class="s" x="38" y="148">rotating batch</text>
<text class="n" x="213" y="82">02</text><text class="t" x="213" y="108">Screen</text><text class="s" x="213" y="130">trend, momentum,</text><text class="s" x="213" y="148">liquidity</text>
<text class="n" x="388" y="82">03</text><text class="t" x="388" y="108">Gather</text><text class="s" x="388" y="130">news, earnings,</text><text class="s" x="388" y="148">SEC filings</text>
<text class="n" x="563" y="82">04</text><text class="t" x="563" y="108">The desk</text><text class="s" x="563" y="130">research, debate,</text><text class="s" x="563" y="148">judge. Free, CPU</text>
<text class="n" x="738" y="82">05</text><text class="t" x="738" y="108">Queue, fill</text><text class="s" x="738" y="130">stocks + SPY, fees,</text><text class="s" x="738" y="148">slippage</text>
<text class="n" x="913" y="82">06</text><text class="t" x="913" y="108">Publish</text><text class="s" x="913" y="130">ledger, CSV,</text><text class="s" x="913" y="148">dashboard</text>
<g fill="none" stroke="#0f1115" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
<path d="M180 113h16M355 113h16M530 113h16M705 113h16M880 113h16"/>
<path d="M190 107l7 6-7 6M365 107l7 6-7 6M540 107l7 6-7 6M715 107l7 6-7 6M890 107l7 6-7 6"/>
