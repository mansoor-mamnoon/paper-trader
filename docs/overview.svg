<circle r="6"><animateMotion dur="5s" begin="2s" repeatCount="indefinite" path="M870 316H900V176H930"/></circle>
<circle r="6"><animateMotion dur="5s" begin="3s" repeatCount="indefinite" path="M1048 260V300"/></circle></g>
