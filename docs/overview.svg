<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="Project overview: data sources feed the screen and the AI analyst, the live account and shadow accounts trade, ledgers are committed, and a static dashboard publishes the results">
<defs><pattern id="g" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#dde5f4" stroke-width="1.4"/></pattern></defs>
<style>
text{font-family:'Helvetica Neue',Arial,sans-serif;fill:#0f1115}
.h{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;font-weight:700;letter-spacing:2px}
.t{font-size:19px;font-weight:900;letter-spacing:-.4px}
.s{font-size:13px;fill:#44505f;font-family:ui-monospace,Menlo,Consolas,monospace}
.b{fill:#fff;stroke:#0f1115;stroke-width:2.5}
.y{fill:#ffe14d;stroke:#0f1115;stroke-width:2.5}
.sh{fill:#0f1115}
.a{fill:none;stroke:#0f1115;stroke-width:2.5;stroke-linejoin:round}
</style>
<rect width="1200" height="640" fill="#fbfbf8"/><rect width="1200" height="640" fill="url(#g)"/><rect x="1.5" y="1.5" width="1197" height="637" fill="none" stroke="#0f1115" stroke-width="3"/>
<text class="h" x="40" y="46">DATA</text><text class="h" x="330" y="46">DECIDE</text><text class="h" x="650" y="46">LEDGER</text><text class="h" x="900" y="46">PUBLISH</text>

<rect class="sh" x="46" y="76" width="226" height="86" rx="10"/><rect class="b" x="40" y="70" width="226" height="86" rx="10"/>
<text class="t" x="58" y="102">Nasdaq directory</text><text class="s" x="58" y="124">13k US-listed symbols</text><text class="s" x="58" y="142">and the earnings calendar</text>
<rect class="sh" x="46" y="182" width="226" height="86" rx="10"/><rect class="b" x="40" y="176" width="226" height="86" rx="10"/>
<text class="t" x="58" y="208">Yahoo Finance</text><text class="s" x="58" y="230">daily bars, splits,</text><text class="s" x="58" y="248">dividends, headlines</text>
<rect class="sh" x="46" y="406" width="226" height="86" rx="10"/><rect class="b" x="40" y="400" width="226" height="86" rx="10"/>
<text class="t" x="58" y="432">Kraken public API</text><text class="s" x="58" y="454">BTC ETH SOL ADA,</text><text class="s" x="58" y="472">hourly candles</text>

<rect class="sh" x="336" y="96" width="282" height="196" rx="12"/><rect class="y" x="330" y="90" width="282" height="196" rx="12"/>
<text class="t" x="352" y="122">Stock account + desk</text><text class="s" x="352" y="146">1. screen: trend + momentum</text>
<text class="s" x="352" y="166">2. triage, research agents</text><text class="s" x="352" y="186">   with SEC filing tools</text>
<text class="s" x="352" y="206">3. bull vs bear, then judge</text><text class="s" x="352" y="226">4. doctor, memory, scorecard</text><text class="s" x="352" y="246">5. stocks only, all cash allocated</text>
<text class="s" x="352" y="270">daily, after the close</text>

<rect class="sh" x="336" y="326" width="282" height="76" rx="12"/><rect class="b" x="330" y="320" width="282" height="76" rx="12" stroke-dasharray="7 5"/>
<text class="t" x="352" y="350">Depth ladder + challengers</text><text class="s" x="352" y="372">no-AI, single-shot and committee</text><text class="s" x="352" y="388">shadows trade the same data</text>

<rect class="sh" x="336" y="426" width="282" height="86" rx="12"/><rect class="b" x="330" y="420" width="282" height="86" rx="12"/>
<text class="t" x="352" y="450">Crypto account</text><text class="s" x="352" y="472">own database, 20h/50h trend,</text><text class="s" x="352" y="490">closed candles only</text>

<rect class="sh" x="686" y="176" width="190" height="286" rx="12"/><rect class="b" x="680" y="170" width="190" height="286" rx="12"/>
<text class="t" x="702" y="204">SQLite ledgers</text>
<text class="s" x="702" y="236">state</text><text class="s" x="702" y="260">decisions</text><text class="s" x="702" y="284">fills</text><text class="s" x="702" y="308">equity</text><text class="s" x="702" y="332">events</text>
<text class="s" x="702" y="376">+ strategy registry</text><text class="s" x="702" y="396">committed to the</text><text class="s" x="702" y="416">account branch</text>

<rect class="sh" x="936" y="96" width="236" height="170" rx="12"/><rect class="b" x="930" y="90" width="236" height="170" rx="12"/>
<text class="t" x="948" y="122">Static export</text><text class="s" x="948" y="146">api/state, universe</text><text class="s" x="948" y="164">decisions, fills, equity,</text><text class="s" x="948" y="182">events as CSV</text>
<polyline points="950,238 976,224 1002,232 1028,212 1054,220 1080,206 1106,212 1146,200" fill="none" stroke="#0f1115" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

<rect class="sh" x="936" y="306" width="236" height="110" rx="12"/><rect class="b" x="930" y="300" width="236" height="110" rx="12"/>
<text class="t" x="948" y="334">GitHub Pages</text><text class="s" x="948" y="358">read-only dashboard,</text><text class="s" x="948" y="376">rebuilt by Actions</text><text class="s" x="948" y="394">no server to run</text>

<rect class="sh" x="686" y="526" width="486" height="86" rx="12"/><rect class="b" x="680" y="520" width="486" height="86" rx="12"/>
<text class="t" x="700" y="552">Local models on a runner</text>
<text class="s" x="700" y="574">Nine model roles on llama.cpp, inside the job.</text><text class="s" x="700" y="592">A schedule or webhook starts it. No key, no server.</text>

<g class="a"><path d="M266 113H298V188H330"/><path d="M266 219H298V188"/><path d="M612 190H646V300H680"/><path d="M612 364H646V300"/><path d="M612 466H646V380H680"/><path d="M270 443H330"/><path d="M870 316H900V176H930"/><path d="M1048 260V300"/></g>
