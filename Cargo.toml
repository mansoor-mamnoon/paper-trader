[package]
name = "paper-trader"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "A $1,000 paper-trading experiment for US stocks and crypto that publishes every decision."
license = "MIT"
repository = "https://github.com/mansoor-mamnoon/paper-trader"
readme = "README.md"
keywords = ["paper-trading", "trading", "stocks", "crypto", "backtesting"]
categories = ["finance", "command-line-utilities"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
similar_names = "allow"
float_cmp = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
